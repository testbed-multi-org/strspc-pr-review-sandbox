name: Token check

# Managed by SteerSpec/strspc-pr-review e2e/pr-auto-approve/sandbox.sh check-tokens.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SteerSpec/strspc-pr-review
          ref: 7f38da251707cbd5da6223c372ebbc92bab2c5ee
          persist-credentials: false
      - env:
          BOT_TOKEN_SANDBOX: ${{ secrets.BOT_TOKEN_SANDBOX }}
        run: e2e/pr-auto-approve/token-check.sh "$GITHUB_REPOSITORY" BOT_TOKEN_SANDBOX
